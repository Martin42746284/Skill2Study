version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skill2study-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: martin4274
      POSTGRES_DB: orientation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skill2study-network

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    image: skill2study_ai-service:latest
    container_name: skill2study-ai-service
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service:/app/ai-service
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:martin4274@postgres:5432/orientation_db
      - AI_SERVICE_PORT=5000
      - AI_SERVICE_DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skill2study-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  skill2study-network:
    driver: bridge
