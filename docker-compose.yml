version: '3.8'

services:
  # ─── BASE DE DONNÉES PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: skill2study_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: martin4274
      POSTGRES_DB: orientation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skill2study-network


  # ─── SERVICE IA PYTHON ──────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skill2study_ai_service
    environment:
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service/logs:/app/logs
      - ./ai-service/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - skill2study-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


